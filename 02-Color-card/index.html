<!-- This is your HTML -- the skeleton of the page -->

<!doctype html>
<html>
  <head>
    <title>My Card</title>

    <!-- CSS goes here -- this is the "clothes" -->
    <style>
      body {
        display: flex;
        justify-content: center;
        padding: 40px;
        background: #f0f0f0;
      }

      .card {
        background: white;
        padding: 30px;
        border-radius: 12px;
        width: 300px;
        text-align: center;
      }

      /* The button starts with this style */
      button {
        margin: 8px;
        padding: 10px 20px;
        border: none;
        border-radius: 8px;
        cursor: pointer;
        font-size: 14px;
      }
    </style>
  </head>

  <body>
    <!-- id="card" lets JavaScript find this element -->
    <div id="card" class="card">
      <h2>Your Name</h2>
      <p>Learning fullstack development.</p>

      <!-- onclick calls a JS function when clicked -->
      <button onclick="changeColor('pink')">Pink</button>
      <button onclick="changeColor('lightblue')">Blue</button>
      <button onclick="changeColor('lightgreen')">Green</button>
      <button onclick="changeColor('white')">White</button>
      <p id="message"></p>
    </div>

    <!-- JavaScript goes here -- this is the "muscles" -->
    <script>
      let counter = 0;
      // This is a FUNCTION -- a reusable block of code
      // "color" is whatever value the button passes in

      function changeColor(color) {
        let card = document.querySelector("#card");
        card.style.backgroundColor = color;
        counter++;

        // ADD THESE 2 NEW LINES:
        let message = document.querySelector("#message");
        message.textContent =
          "Color changed to " + color + " " + counter + " " + "times";
      }
    </script>
  </body>
</html>
